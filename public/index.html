<!DOCTYPE html>

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1524" />

    <!-- Applies a saved light-mode preference before first paint, so returning
         visitors who chose light don't see a flash of dark before it switches. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Analytics (GA4) — only loads if REACT_APP_GA_MEASUREMENT_ID is set at build time -->
    <script>
      (function () {
        var GA_ID = "%REACT_APP_GA_MEASUREMENT_ID%";
        if (!GA_ID || GA_ID.indexOf("%") === 0) return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", GA_ID);
      })();
    </script>
